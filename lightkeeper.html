<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}</style>
</head>
<body>
<title>守灯人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 布局：整屏夜海画布，灯塔居中；HUD 浮在顶部两角，操作按钮贴底，卡片居中覆盖。单一夜间配色，刻意不做浅色主题 */
:root{
  --sea:#07141c; --sea-2:#0e2531; --beam:#ffd27a; --ink:#e9eff1; --muted:#87a1ab;
  --danger:#ff6b57; --safe:#7fd3c3; --card:rgba(9,24,33,.9); --line:rgba(255,210,122,.22); --chip:rgba(255,210,122,.08);
  --f-display:"Noto Serif SC","Songti SC","STSong","Hiragino Mincho ProN",serif;
  --f-body:system-ui,-apple-system,"PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--sea);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;pointer-events:none}
.hud .grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.hud .right{align-items:flex-end;flex-shrink:0}
.lbl{font-size:11px;letter-spacing:.14em;color:var(--muted)}
.night{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.06em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.clock{font-size:15px;color:var(--beam)}
.wx{display:flex;gap:6px;flex-wrap:wrap}
.wx span{font-size:11px;letter-spacing:.08em;padding:2px 7px;border:1px solid var(--line);border-radius:3px;color:var(--ink);background:var(--chip)}
.wx span.boss{border-color:var(--beam);color:var(--beam)}
.task{font-size:12px;line-height:1.5;color:var(--ink);max-width:240px;margin-top:2px}
.task.done{color:var(--safe)}
.task.fail{color:var(--muted);text-decoration:line-through}
.score{font-size:26px;font-weight:700;line-height:1}
.lives{display:flex;gap:6px;margin-top:4px}
.lives i{width:10px;height:10px;border-radius:50%;background:var(--beam);box-shadow:0 0 10px var(--beam);transition:opacity .3s,box-shadow .3s}
.lives i.off{opacity:.18;box-shadow:none}
.oil{display:flex;flex-direction:column;gap:5px;margin-top:6px;align-items:flex-end}
.oilrow{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);letter-spacing:.1em}
.oilbar{width:84px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.oilbar b{display:block;height:100%;width:100%;background:var(--beam);transition:background .2s}
.oilbar b.low{background:var(--danger)}
.oilbar b.offlamp{background:var(--muted)}
.hint{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);width:min(480px,calc(100% - 32px));text-align:center;
  font-size:13px;line-height:1.6;color:var(--muted);pointer-events:none;transition:opacity .8s}
.toast{position:absolute;left:50%;bottom:128px;z-index:4;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--card);border:1px solid var(--beam);
  color:var(--beam);border-radius:4px;padding:8px 14px;font-size:13px;letter-spacing:.06em;pointer-events:none;transition:opacity .4s;white-space:nowrap}
.ctrl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;pointer-events:none}
.ctrl button{pointer-events:auto;appearance:none;background:rgba(9,24,33,.75);border:1px solid var(--line);color:var(--ink);border-radius:4px;
  font:600 13px var(--f-body);letter-spacing:.06em;padding:9px 14px;cursor:pointer;min-width:96px}
.ctrl button.ready{border-color:var(--beam);color:var(--beam)}
.ctrl button:disabled{opacity:.45;cursor:default}
.ctrl kbd{font:500 10px var(--f-mono);color:var(--muted);margin-left:6px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{width:min(410px,100%);max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:22px 22px 20px;
  display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:42px;letter-spacing:.1em;line-height:1.1;color:var(--beam);text-wrap:balance}
.card h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.06em;text-wrap:balance}
.card p{margin:0;font-size:14px;line-height:1.7;color:var(--muted)}
.card p b{color:var(--ink);font-weight:600}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.langs{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.langs button{appearance:none;background:transparent;border:0;color:var(--muted);font:600 12px var(--f-body);padding:5px 9px;cursor:pointer}
.langs button+button{border-left:1px solid var(--line)}
.langs button[aria-pressed="true"]{background:var(--chip);color:var(--beam)}
.langs button:disabled{opacity:.35;cursor:not-allowed}
#colorSeg button,#diffSeg button,#boardTabs button{flex:1}
.opt.wide{grid-column:1/-1}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lvgrid .opt{gap:4px}
.lvgrid .opt small{font-size:11.5px}
.lvgrid .stars{font-size:15px;letter-spacing:2px;color:var(--beam)}
.lvgrid .stars i{font-style:normal;color:var(--line)}
.lvgrid .opt:disabled{opacity:.42;cursor:not-allowed}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:46vh;overflow:auto}
.rank li{display:grid;grid-template-columns:2.2em 22px 1fr auto;align-items:center;gap:8px;padding:6px 8px;border-radius:4px;font-size:13.5px}
.rank li:nth-child(-n+3) .no{color:var(--beam);font-weight:700}
.rank li.me{background:var(--chip);outline:1px solid var(--line)}
.rank li.gap{display:block;text-align:center;color:var(--muted);padding:0}
.rank .no{font-family:var(--f-mono);color:var(--muted);text-align:right}
.rank img{width:22px;height:22px;border-radius:50%;display:block}
.rank .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.rank .sc small{color:var(--safe);margin-right:6px;font-family:var(--f-body)}
.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.log{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px;border-top:1px solid var(--line);padding-top:12px}
.log span:nth-child(odd){color:var(--muted)}
.log span:nth-child(even){font-family:var(--f-mono);text-align:right}
.btn{appearance:none;border:0;border-radius:4px;background:var(--beam);color:#1a1205;font:700 15px var(--f-body);letter-spacing:.08em;
  padding:12px 16px;cursor:pointer;transition:transform .12s,filter .12s}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.mute:focus-visible,.opt:focus-visible,.ctrl button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.row{display:flex;gap:10px}.row .btn{flex:1}
.note{font-size:12px;color:var(--safe)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{appearance:none;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:4px;color:var(--ink);padding:11px 12px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;font-family:var(--f-body);transition:border-color .15s,background .15s;min-width:0}
.opt:hover{border-color:var(--beam);background:rgba(255,210,122,.14)}
.opt strong{font-family:var(--f-display);font-weight:900;font-size:16px;letter-spacing:.04em}
.opt small{font-size:12px;color:var(--muted);line-height:1.45}
.opt .best{font:500 11px var(--f-mono);color:var(--beam)}
.picks{display:flex;flex-direction:column;gap:8px}
.picks .opt strong{color:var(--beam)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-size:13px;color:var(--ink);letter-spacing:.04em}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:12.5px;color:var(--muted);align-items:baseline;margin-top:10px}
.legend em{font-style:normal;font-family:var(--f-mono);color:var(--ink);font-size:12px;white-space:nowrap}
.legend .sec{grid-column:1/-1;color:var(--beam);font-size:11px;letter-spacing:.14em;margin-top:4px}
.ach{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.ach div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12.5px;color:var(--muted);opacity:.55}
.ach div span:last-child{text-align:right}
.ach div.got{opacity:1}
.ach div.got strong{color:var(--beam)}
.ach strong{font-weight:600;color:var(--ink);white-space:nowrap}
.mute{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;appearance:none;background:transparent;border:1px solid var(--line);
  color:var(--muted);border-radius:4px;font:500 12px var(--f-mono);padding:6px 10px;cursor:pointer}
.overlay{z-index:3}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--ink)}
.setrow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.setrow input[type=range]{width:130px;accent-color:#ffd27a}
.tog{appearance:none;min-width:56px;border:1px solid var(--line);border-radius:4px;background:transparent;color:var(--muted);font:600 12px var(--f-body);padding:5px 10px;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--chip);color:var(--beam);border-color:var(--beam)}
.tog:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sharetxt{-webkit-user-select:text;user-select:text;font-size:13px!important;color:var(--ink)!important;background:var(--chip);padding:8px 10px;border-radius:4px}
.ctrl .icon{min-width:0}
@media (min-width:700px){.toast{bottom:auto;top:16px}}
body.big .card,body.big .hud,body.big .ctrl,body.big .hint,body.big .toast{zoom:1.15}
@media (max-width:520px){.ctrl{justify-content:flex-start}.mute{bottom:62px}.hint{bottom:110px}.toast{bottom:150px}.task{max-width:170px}}
@media (prefers-reduced-motion:reduce){.hint,.toast{transition:none}}
</style>

<div id="app">
  <canvas id="sea" aria-label="Lighthouse"></canvas>

  <header class="hud">
    <div class="grp">
      <div class="night" id="nightLbl"></div>
      <div class="clock mono" id="clock">22:00</div>
      <div class="wx" id="wx"></div>
      <div class="task" id="task" hidden></div>
    </div>
    <div class="grp right">
      <span class="lbl" data-i18n="hudScore"></span>
      <span class="score mono" id="score">0</span>
      <div class="lives" id="lives"></div>
      <div class="oil" id="oil"></div>
    </div>
  </header>

  <div class="hint" id="hint" style="opacity:0"></div>
  <div class="toast" id="toast" style="opacity:0" role="status" aria-live="polite"></div>

  <div class="ctrl" id="ctrl" hidden>
    <button id="pauseBtn" class="icon" type="button"><span data-i18n="pauseBtn"></span><kbd>Esc</kbd></button>
    <button id="skipBtn" class="icon" type="button" hidden data-i18n="skip"></button>
    <button id="lampBtn" type="button"><span id="lampTxt"></span><kbd id="lampKey">S</kbd></button>
    <button id="boostBtn" type="button" hidden><span id="boostTxt"></span><kbd id="boostKey"></kbd></button>
  </div>

  <div class="overlay" id="menu">
    <section class="card">
      <div class="topline">
        <span class="lbl" data-i18n="tag"></span>
        <div class="langs" id="langs" role="group" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ja">日本語</button>
        </div>
      </div>
      <h1 data-i18n="title"></h1>
      <p data-i18n-html="intro"></p>
      <button class="btn" id="contBtn" type="button" hidden></button>
      <div class="modes">
        <button class="opt wide" id="logBtn" type="button"><strong data-i18n="m_log"></strong><small data-i18n="m_log_d"></small><span class="best" id="best-log"></span></button>
        <button class="opt" data-mode="classic"><strong data-i18n="m_classic"></strong><small data-i18n="m_classic_d"></small><span class="best" id="best-classic"></span></button>
        <button class="opt" data-mode="endless"><strong data-i18n="m_endless"></strong><small data-i18n="m_endless_d"></small><span class="best" id="best-endless"></span></button>
        <button class="opt" data-mode="daily"><strong data-i18n="m_daily"></strong><small data-i18n="m_daily_d"></small><span class="best" id="best-daily"></span></button>
        <button class="opt" data-mode="duo"><strong data-i18n="m_duo"></strong><small data-i18n="m_duo_d"></small><span class="best" id="best-duo"></span></button>
      </div>
      <div class="row">
        <button class="btn ghost" id="menuSetBtn" type="button" data-i18n="settings"></button>
        <button class="btn ghost" id="menuStatBtn" type="button" data-i18n="stats"></button>
      </div>
      <button class="btn ghost" id="menuBoardBtn" type="button" hidden data-i18n="board"></button>
      <details>
        <summary data-i18n="guide"></summary>
        <div class="legend" id="legend"></div>
      </details>
      <details>
        <summary id="achSum"></summary>
        <div class="ach" id="achList"></div>
      </details>
    </section>
  </div>

  <div class="overlay" id="dusk" hidden>
    <section class="card">
      <span class="lbl mono" id="duskLbl"></span>
      <h2 id="duskTitle"></h2>
      <div class="log">
        <span id="dSavedL"></span><span id="dSaved">0</span>
        <span id="dWreckL"></span><span id="dWreck">0</span>
        <span data-i18n="total"></span><span id="dScore">0</span>
      </div>
      <p class="note" id="duskTask"></p>
      <p class="note" id="duskNote" hidden data-i18n="cleanNote"></p>
      <p id="duskNext"></p>
      <span class="lbl" data-i18n="pickLbl"></span>
      <div class="picks" id="picks"></div>
    </section>
  </div>

  <div class="overlay" id="over" hidden>
    <section class="card">
      <span class="lbl mono" id="overTime"></span>
      <h2 id="overTitle"></h2>
      <div class="log">
        <span data-i18n="oScore"></span><span id="oScore">0</span>
        <span id="oNightsL"></span><span id="oNights">0</span>
        <span id="oBestL"></span><span id="oBest">0</span>
      </div>
      <p class="note" id="oNew" hidden data-i18n="newRec"></p>
      <p id="oDetail" style="white-space:pre-line"></p>
      <p class="note" id="oRank" hidden></p>
      <div class="row">
        <button class="btn" id="againBtn" data-i18n="again"></button>
        <button class="btn ghost" id="menuBtn" data-i18n="menu"></button>
      </div>
      <div class="row">
        <button class="btn" id="nextLvBtn" type="button" hidden data-i18n="nextLv"></button>
      </div>
      <button class="btn ghost" id="copyBtn" type="button" data-i18n="copy"></button>
      <p class="sharetxt" id="shareTxt" hidden></p>
    </section>
  </div>

  <div class="overlay" id="pause" hidden>
    <section class="card">
      <span class="lbl mono" id="pauseLbl"></span>
      <h2 data-i18n="pause"></h2>
      <button class="btn" id="resumeBtn" type="button" data-i18n="resume"></button>
      <div class="row">
        <button class="btn ghost" id="restartBtn" type="button" data-i18n="restart"></button>
        <button class="btn ghost" id="pauseSetBtn" type="button" data-i18n="settings"></button>
      </div>
      <button class="btn ghost" id="pauseMenuBtn" type="button" data-i18n="toMenu"></button>
    </section>
  </div>

  <div class="overlay" id="settings" hidden>
    <section class="card">
      <h2 data-i18n="settings"></h2>
      <div class="setrow"><span data-i18n="langLbl"></span>
        <div class="langs" role="group" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ja">日本語</button>
        </div>
      </div>
      <div class="setrow"><div><span data-i18n="beamColor"></span><small id="colorNote"></small></div></div>
      <div class="langs" id="colorSeg" role="group">
        <button type="button" data-beam="amber" data-i18n="c_amber"></button>
        <button type="button" data-beam="white" data-i18n="c_white"></button>
        <button type="button" data-beam="jade" data-i18n="c_jade"></button>
        <button type="button" data-beam="rose" data-i18n="c_rose"></button>
        <button type="button" data-beam="violet" data-i18n="c_violet"></button>
      </div>
      <div class="setrow"><div><span data-i18n="diff"></span><small data-i18n="diffNote"></small></div></div>
      <div class="langs" id="diffSeg" role="group">
        <button type="button" data-diff="easy" data-i18n="d_easy"></button>
        <button type="button" data-diff="normal" data-i18n="d_normal"></button>
        <button type="button" data-diff="hard" data-i18n="d_hard"></button>
      </div>
      <div class="setrow"><label for="vol" data-i18n="vol"></label><input type="range" id="vol" min="0" max="1" step="0.05"></div>
      <div class="setrow"><span data-i18n="ambient"></span><button class="tog" id="optAmb" type="button"></button></div>
      <div class="setrow"><span data-i18n="shakeOpt"></span><button class="tog" id="optShake" type="button"></button></div>
      <div class="setrow"><span data-i18n="flashOpt"></span><button class="tog" id="optFlash" type="button"></button></div>
      <div class="setrow"><div><span data-i18n="cbOpt"></span><small data-i18n="cbNote"></small></div><button class="tog" id="optCb" type="button"></button></div>
      <div class="setrow"><span data-i18n="bigOpt"></span><button class="tog" id="optBig" type="button"></button></div>
      <div class="setrow"><div><span data-i18n="warnOpt"></span><small data-i18n="warnNote"></small></div><button class="tog" id="optWarn" type="button"></button></div>
      <button class="btn" id="setDoneBtn" type="button" data-i18n="done"></button>
    </section>
  </div>

  <div class="overlay" id="levels" hidden>
    <section class="card">
      <h2 data-i18n="m_log"></h2>
      <p data-i18n="logIntro"></p>
      <div class="lvgrid" id="lvGrid"></div>
      <button class="btn" id="levelsBackBtn" type="button" data-i18n="back"></button>
    </section>
  </div>

  <div class="overlay" id="board" hidden>
    <section class="card">
      <h2 data-i18n="board"></h2>
      <div class="langs" id="boardTabs" role="tablist">
        <button type="button" data-tab="daily" data-i18n="bd_today"></button>
        <button type="button" data-tab="classic" data-i18n="m_classic"></button>
        <button type="button" data-tab="endless" data-i18n="m_endless"></button>
        <button type="button" data-tab="duo" data-i18n="m_duo"></button>
      </div>
      <p id="boardNote"></p>
      <ol class="rank" id="boardList"></ol>
      <button class="btn" id="boardBackBtn" type="button" data-i18n="back"></button>
    </section>
  </div>

  <div class="overlay" id="stats" hidden>
    <section class="card">
      <h2 data-i18n="stats"></h2>
      <div class="log" id="statLog"></div>
      <span class="lbl" data-i18n="stByType"></span>
      <div class="log" id="statType"></div>
      <button class="btn" id="statBackBtn" type="button" data-i18n="back"></button>
    </section>
  </div>

  <button class="mute" id="mute" aria-pressed="false"></button>
</div>

<script>
(function(){
const cv=document.getElementById('sea'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const TAU=Math.PI*2;
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ================= 多语言 ================= */
const I18N={
zh:{
  tag:'一座灯塔 · 一圈暗礁 · 一整夜',title:'守灯人',

function t(k,p){let s=(I18N[lang]&&I18N[lang][k]);if(s==null)s=I18N.zh[k]!=null?I18N.zh[k]:k;if(p)for(const x in p)s=s.split('{'+x+'}').join(p[x]);return s}
function applyStatic(){

function buildLegend(){

  ['fish','cargo','skiff','life','smug','stub','pirate','supply','flag'].forEach(b=>rows.push(['b_'+b,'b_'+b+'_d']));
  rows.push(['sec','sec_sea'],['s_whale','s_whale_d'],['s_item','s_item_d'],['s_task','s_task_d']);
  rows.push(['sec','sec_wx'],['w_fog','w_fog_d'],['w_storm','w_storm_d'],['w_tide','w_tide_d'],['w_vortex','w_vortex_d'],['w_moon','w_moon_d']);
  rows.push(['sec','sec_ctrl'],['c_rot','c_rot_d'],['c_lamp','c_lamp_d'],['c_boost','c_boost_d'],['c_pad','c_pad_d']);
  const el=$('legend');el.innerHTML='';
  for(const [a,b] of rows){
    if(a==='sec'){const s=document.createElement('span');s.className='sec';s.textContent=t(b);el.appendChild(s);continue}

/* ================= 随机数 ================= */
let rng=Math.random;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
const rr=(a,b)=>a+rng()*(b-a);
const rnd=(a,b)=>a+Math.random()*(b-a);
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d}
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}

/* ================= 画面 ================= */
let W=0,H=0,cx=0,cy=0,R=60,U=1,L=1000,Rcur=60;
let rocks=[],waves=[],fogs=[],rain=[];
function resize(){
  const dpr=lowQ?1:Math.min(2,window.devicePixelRatio||1);
  const had=W>0,ocx=cx,ocy=cy,oU=U;
  const r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H/2+(H>W?20:8);U=Math.max(.7,Math.min(W,H)/620);
  R=Math.max(62,Math.min(W,H)*.16);L=Math.hypot(W,H);Rcur=R;
  if(had&&oU>0){ // 旋转手机或缩放窗口时，船、雾、漩涡跟着画面一起缩放
    const k=U/oU,mv=o=>{o.x=cx+(o.x-ocx)*k;o.y=cy+(o.y-ocy)*k};
    boats.forEach(b=>{mv(b);b.v*=k;b.v0*=k});items.forEach(mv);parts.forEach(mv);floats.forEach(mv);
    whales.forEach(w=>{mv(w);w.r*=k;w.v*=k});fogs.forEach(f=>{mv(f);f.r*=k;f.vx*=k});
    if(vortex){mv(vortex);vortex.r*=k}
  }
  buildScene();
}
function buildScene(){
  rocks=[];let s=7;const rand=()=>{s=(s*16807)%2147483647;return s/2147483647};
  const n=Math.round(R*TAU/16);
  for(let i=0;i<n;i++){
    const a=i/n*TAU+rand()*.1,off=(rand()-.5)*10*U,sz=(6+rand()*9)*U,pts=[],k=5+Math.floor(rand()*3);
    for(let j=0;j<k;j++){const q=j/k*TAU;pts.push([Math.cos(q)*sz*(.6+rand()*.5),Math.sin(q)*sz*(.6+rand()*.5)])}
    const p=new Path2D();pts.forEach((q,i)=>i?p.lineTo(q[0],q[1]):p.moveTo(q[0],q[1]));p.closePath();
    rocks.push({a,off,pts,p});
  }
  waves=[];const wn=Math.round(W*H/(lowQ?18000:9000));
  for(let i=0;i<wn;i++)waves.push({x:rand()*W,y:rand()*H,len:(10+rand()*18)*U,ph:rand()*TAU});
  rain=[];for(let i=0;i<90;i++)rain.push({x:rand()*W,y:rand()*H,s:.7+rand()*.6});
}

function mkBeam(a){return{a,t:a,on:true,oil:1,boost:0,cd:0}}

const level=()=>mode==='daily'?2.6+elapsed/28:mode==='log'?curLevel.lv:night;
const beamHalf=()=>Math.max(.12,.21-.012*(Math.min(level(),8)-1))*(1+.2*(UP.wide||0))*(tmpWide>0?1.5:1);
const rotSpeed=()=>4.4*(1+.3*(UP.spin||0));
const boostCD=()=>15*(1-.25*(UP.boostcd||0));
function rays(b){
  let j=0;
  if(weather.storm&&state==='play')j=Math.sin(time*6.3+b.a)*.06+Math.sin(time*2.3)*.05;
  return UP.twin?[b.a+j,b.a+Math.PI+j]:[b.a+j];
}
// 每帧算一次光束角度与鲸鱼遮挡，避免对每个波纹/礁石/船重复计算
let RAYS=[],HALF=.2,SHADOWS=[];
function prepRays(){
  RAYS=[];HALF=beamHalf();
  for(const b of beams){if(!b.on)continue;const w=b.boost>0?2:1;for(const r of rays(b))RAYS.push(r,w)}
  SHADOWS=[];
  for(const w of whales){if(w.a<.5)continue;const wx=w.x-cx,wy=w.y-cy,dw=Math.hypot(wx,wy);if(dw<=w.r)continue;
    SHADOWS.push(Math.atan2(wy,wx),Math.asin(Math.min(1,w.r/dw)),dw-w.r*.4)}
}
function hits(x,y,noBlock){
  if(!RAYS.length)return 0;
  const dx=x-cx,dy=y-cy,d2=dx*dx+dy*dy;if(d2<400)return 0;
  const ang=Math.atan2(dy,dx);
  let n=0;
  for(let i=0;i<RAYS.length;i+=2)if(Math.abs(angDiff(ang,RAYS[i]))<HALF)n+=RAYS[i+1];
  if(n&&!noBlock&&SHADOWS.length){const dp=Math.sqrt(d2);
    for(let i=0;i<SHADOWS.length;i+=3)if(dp>SHADOWS[i+2]&&Math.abs(angDiff(ang,SHADOWS[i]))<SHADOWS[i+1])return 0}
  return n;
}
function inFog(x,y){if(!weather.fog)return false;for(const f of fogs){const dx=x-f.x,dy=y-f.y;if(dx*dx+dy*dy<f.r*f.r*.7)return true}return false}
function float(x,y,txt,col){floats.push({x,y,t:0,txt,col})}

/* ================= 每夜任务 ================= */
function pickTask(){
  if(mode==='log'){const g=curLevel.goal;task={id:g.k,goal:g.n||1,prog:0,done:false,fail:false};renderTask();return}
  const lv=Math.floor(level());
  const pool=TASKS.filter(x=>lv>=x.min&&(!x.max||lv<=x.max));
  const d=pool[Math.floor(rng()*pool.length)];
  task={id:d.id,goal:d.goal,prog:0,done:false,fail:false};renderTask();
}
function renderTask(){
  const el=$('task');if(!task){el.hidden=true;return}
  el.hidden=false;el.className='task'+(task.done?' done':task.fail?' fail':'');
  el.textContent=t('taskLbl',{t:t('t_'+task.id)})+(task.goal>1&&!task.done?'  '+task.prog+'/'+task.goal:'')+(task.done?'  ✓':'');
}
function progress(id){
  if(!task||task.done||task.fail||task.id!==id||state!=='play')return;
  task.prog++;if(task.prog>=task.goal)completeTask();else renderTask();
}
function completeTask(){
  task.done=true;score+=8;updateHud();beams.forEach(b=>b.oil=1);
  float(cx,cy-60*U,t('f_task'),'#7fd3c3');bell(880);
  tasksDone++;try{localStorage.setItem('keeper2-tasks',tasksDone)}catch(e){}
  if(tasksDone>=5)unlock('task5');
  renderTask();
}

/* ================= 天气 ================= */
function rollWeather(n){
  if(mode==='log')return Object.assign({},curLevel.wx);
  const all=['fog','storm','tide','vortex'];let pick=[];
  if(mode==='daily')pick=all.slice().sort(()=>rng()-.5).slice(0,2);
  else if(n<=1)pick=[];
  else if(n===2)pick=[rng()<.5?'fog':'tide'];
  else if(n===3)pick=[rng()<.6?'storm':'vortex'];
  else{const k=rng()<.5?1:2;pick=all.slice().sort(()=>rng()-.5).slice(0,k)}
  const w={};pick.forEach(p=>w[p]=true);
  if(n>=2&&!w.fog&&!w.storm&&rng()<.3)w.moon=true; // 满月只出现在晴朗的夜里
  return w;
}
function applyWeather(w){
  weather=w;fogs=[];
  if(w.fog){const n=6+Math.floor(rng()*3);for(let i=0;i<n;i++)fogs.push({x:rng()*W,y:rng()*H,r:(70+rng()*80)*U,vx:(8+rng()*14)*U*(rng()<.5?-1:1)})}
  if(w.vortex){const a=rng()*TAU,d=rr(Rcur+110*U,Math.max(Rcur+130*U,Math.min(W,H)/2-50));vortex={x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,r:95*U}}else vortex=null;
  lightT=rr(4,7);renderWx();
}
function renderWx(){
  const el=$('wx');el.innerHTML='';if(state==='menu')return;
  const keys=Object.keys(weather);
  (keys.length?keys:['clear']).forEach(k=>{const s=document.createElement('span');s.textContent=t('w_'+k);el.appendChild(s)});
  if(bossNight){const s=document.createElement('span');s.className='boss';s.textContent=t('w_boss');el.appendChild(s)}
}

/* ================= 生成 ================= */
function pickType(n){
  if(mode==='log'){const ty=curLevel.types;let sum=0;for(const k in ty)sum+=ty[k];let r=rng()*sum;for(const k in ty){if((r-=ty[k])<0)return k}return 'fish'}
  const tb=[['fish',10],['cargo',4],['skiff',n>=2?4:0],['life',n>=2?2:0],['smug',n>=3?3:0],['stub',n>=3?2.5:0],['pirate',n>=4?2:0],['supply',n>=2?1.5:0]];
  let sum=0;tb.forEach(e=>sum+=e[1]);let r=rng()*sum;
  for(const e of tb){if((r-=e[1])<0)return e[0]}return 'fish';
}
function mkBoat(type,x,y,h,g){
  const T=TYPES[type];
  const v=T.speed*U*(1+.085*(Math.min(level(),9)-1))*rr(.9,1.1)*(state==='menu'?1:dif().sp);
  return{x,y,h,v,v0:v,type,lit:0,state:'sail',t:0,turn:0,blink:Math.random()*TAU,charges:T.charges||1,g,hit:0,fog:false};
}
function edgePos(){const a=rng()*TAU,d=L/2+30;const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d;return{x,y,h:Math.atan2(cy-y,cx-x)}}
function spawn(){
  const menu=state==='menu';
  const type=menu?['fish','fish','cargo','skiff'][Math.floor(Math.random()*4)]:pickType(level());
  const p=edgePos(),h=p.h+rr(-.12,.12);
  if(type==='life'){
    const id=++gid,k=3+(rng()<.4?1:0);groups[id]={total:k,saved:0,failed:false,lost:false};
    const px=-Math.sin(h),py=Math.cos(h);
    for(let i=0;i<k;i++){const o=(i-(k-1)/2)*15*U,back=Math.abs(i-(k-1)/2)*10*U;
      boats.push(mkBoat('life',p.x+px*o-Math.cos(h)*back,p.y+py*o-Math.sin(h)*back,h,id))}
  }else boats.push(mkBoat(type,p.x,p.y,h,0));
}
function spawnBoss(){
  const p=edgePos(),flag=mkBoat('flag',p.x,p.y,p.h,0);boats.push(flag);
  const px=-Math.sin(p.h),py=Math.cos(p.h);
  // 护卫与旗舰同速编队前进（被灯照到时仍会加速）
  [-1,1].forEach(s=>{const e=mkBoat('pirate',p.x+px*s*60*U-Math.cos(p.h)*20*U,p.y+py*s*60*U-Math.sin(p.h)*20*U,p.h,0);e.v=e.v0=flag.v*1.1;boats.push(e)});
  float(cx,cy-60*U,t('f_boss'),'#d6b25a');bell(330);
}
function spawnItem(){
  const r=rng(),type=r<.45?'oil':r<.9?'bottle':'ring';
  const a=rng()*TAU,maxD=Math.min(W,H)/2-30,d=rr(Rcur+60*U,Math.max(Rcur+80*U,maxD));
  items.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d,type,lit:0,t:0,life:16,ph:Math.random()*TAU});
}
function spawnWhale(){
  const dir=rng()*TAU,off=(Rcur+80*U+rng()*130*U)*(rng()<.5?-1:1);
  const px=-Math.sin(dir),py=Math.cos(dir),D=L/2+80,v=20*U;
  whales.push({x:cx+px*off-Math.cos(dir)*D,y:cy+py*off-Math.sin(dir)*D,h:dir,v,r:24*U,a:0,t:0,dur:2*D/v,sp:rr(2,4)});
  float(cx,cy-60*U,t('f_whale'),'#9fc3d0');unlock('whale');
}
function collect(it){
  const sx=it.x,sy=it.y-14*U;
  if(it.type==='oil'){beams.forEach(b=>b.oil=Math.min(1,b.oil+.5));float(sx,sy,t('f_oil'),'#ffd27a')}
  else if(it.type==='ring'){
    if(lives<maxLives){lives++;renderLives();float(sx,sy,t('f_ring'),'#ff8a3d')}
    else{score+=6;updateHud();float(sx,sy,t('f_ring2'),'#ff8a3d')}
  }else{
    const r=Math.random();
    if(r<.34){score+=5;updateHud();float(sx,sy,t('f_bScore'),'#7fd3c3')}
    else if(r<.67){tmpWide=10;float(sx,sy,t('f_bWide'),'#ffd27a')}
    else if(UP.boost){beams.forEach(b=>{b.cd=0;b.oil=Math.min(1,b.oil+.3)});float(sx,sy,t('f_bCool'),'#ffd27a')}
    else{beams.forEach(b=>b.oil=Math.min(1,b.oil+.4));float(sx,sy,t('f_bOil'),'#ffd27a')}
  }
  progress('pickup');bell(1180);ST.items++;saveStats();
}

/* ================= 流程 ================= */
function startRun(m,saved){
  mode=m;night=1;score=0;totalT=0;UP={};maxLives=3;lives=3;runFirst=true;gid=0;groups={};
  boats=[];parts=[];floats=[];combo=0;lastSave=-9;shake=0;runBy={};runBest=0;
  runDiff=m==='daily'?'normal':SET.diff;
  if(saved){night=saved.night;score=saved.score;lives=saved.lives;maxLives=saved.maxLives;UP=Object.assign({},saved.UP);runDiff=saved.diff||'normal';totalT=saved.totalT||0}
  rng=m==='daily'?mulberry(todayKey()):m==='log'?mulberry(7700+curLevel.id):Math.random;
  if(!saved){ST.runs++;saveStats();if(m==='classic'||m==='duo')clearSave()}
  loadBests(runDiff);
  tut=(m==='classic'&&!tutDone&&!saved)?1:0;userPause=false;
  const n=MODES[m].beams;beams=[];for(let i=0;i<n;i++)beams.push(mkBeam(n===2?(i?0:Math.PI):-Math.PI/2));
  buildOil();renderLives();updateHud();
  ['menu','dusk','over','pause','settings','stats','board','levels'].forEach(id=>$(id).hidden=true);
  startNight();
}
function nightTitle(){
  return mode==='log'?t('lvTitle',{n:curLevel.id,name:t('lv'+curLevel.id)}):mode==='endless'?t('seg',{n:night}):mode==='daily'?t('daily'):mode==='duo'?t('duoNight',{n:night}):t('night',{n:night});
}
function startNight(){
  elapsed=0;spawnT=1.2;nightSaved=0;nightWreck=0;combo=0;moonSaved=0;
  // 无尽模式的段与段之间海面是连续的，不清走还在航行的船
  if(mode!=='endless')boats=boats.filter(b=>b.state==='saved');
  if(mode!=='endless'){items=[];whales=[]}itemT=rr(6,10);whaleT=rr(8,16);tmpWide=0;
  bossNight=mode==='log'?!!curLevel.boss:(mode!=='daily'&&night%5===0);bossT=bossNight?7:0;
  state='play';
  applyWeather(rollWeather(night));
  beams.forEach(b=>{b.on=true;b.oil=Math.max(b.oil,.6);b.boost=0});
  $('nightLbl').textContent=nightTitle();
  if(mode==='classic'||mode==='duo')writeSave(); // 每夜开始时自动存档
  pickTask();
  $('ctrl').hidden=false;syncCtrl();
  if(runFirst){runFirst=false;if(tut)setTut(1);else showHint()}
}
function setTut(n){
  tut=n;const h=$('hint');clearTimeout(showHint.t);clearTimeout(setTut.t);
  $('skipBtn').hidden=!(n>=1&&n<=3);
  if(n===0){h.style.opacity=0;return}
  h.textContent=t('tut'+n);h.style.opacity=1;
  if(n===4){tutDone=true;try{localStorage.setItem('keeper2-tut','1')}catch(e){}
    setTut.t=setTimeout(()=>{if(tut===4){tut=0;h.style.opacity=0}},2600)}
}
function skipTut(){tutDone=true;try{localStorage.setItem('keeper2-tut','1')}catch(e){}beams.forEach(b=>b.on=true);setTut(0);syncCtrl()}
function showHint(){
  const h=$('hint');h.textContent=mode==='duo'?t('hintDuo'):t('hint');
  h.style.opacity=1;clearTimeout(showHint.t);showHint.t=setTimeout(()=>h.style.opacity=0,8000);
}
function endNight(){
  if(task&&task.id==='clean'&&!task.done&&!task.fail&&nightWreck===0)completeTask();
  const clean=nightWreck===0&&lives<maxLives;
  if(clean&&mode!=='daily'){lives++;renderLives()}
  if(mode==='daily'){unlock('daily');gameOver(true);return}
  if(mode==='log'){ST.nights++;saveStats();gameOver(true);return}
  if(mode!=='endless'){ST.nights++;saveStats();unlock('dawn');if(night>=5)unlock('n5');if(mode==='duo')unlock('duo')}
  state='dusk';$('ctrl').hidden=true;
  const next=night+1,seg=mode==='endless';
  $('duskLbl').textContent=seg?t('segLbl',{t:fmtTime(totalT)}):t('dawn');
  $('duskTitle').textContent=seg?t('segTitle',{n:night}):t('kept',{n:night});
  $('dSavedL').textContent=seg?t('savedS'):t('savedN');$('dWreckL').textContent=seg?t('wreckS'):t('wreckN');
  $('dSaved').textContent=nightSaved;$('dWreck').textContent=nightWreck;$('dScore').textContent=score;
  $('duskTask').textContent=task?t('taskRes',{t:t('t_'+task.id),s:task.done?t('tDone'):t('tFail')}):'';
  $('duskTask').style.color=task&&task.done?'':'var(--muted)';
  $('duskNote').hidden=!clean;
  const tips={2:'tip2',3:'tip3',4:'tip4'};

/* ================= 声音 ================= */
let ac=null,master=null,amb=null;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)}catch(e){ac=null}}
  if(ac&&ac.state==='suspended')ac.resume();
  applyVol();ambientSync();
}
function applyVol(){if(master)master.gain.value=muted?0:SET.vol}
function ambientSync(){
  if(!ac)return;const want=SET.ambient&&!muted&&SET.vol>0;
  if(want&&!amb){
    const len=ac.sampleRate*6,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let v=0;
    for(let i=0;i<len;i++){v=(v+.02*(Math.random()*2-1))/1.02;d[i]=v*3.2}
    const fade=Math.floor(ac.sampleRate*.3);for(let i=0;i<fade;i++){const k=i/fade;d[i]*=k;d[len-1-i]*=k}
    const s=ac.createBufferSource();s.buffer=buf;s.loop=true;
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=480;
    const g=ac.createGain();g.gain.value=.09;
    const lfo=ac.createOscillator();lfo.frequency.value=.11;const lg=ac.createGain();lg.gain.value=.06;lfo.connect(lg).connect(g.gain);
    s.connect(f).connect(g).connect(master);s.start();lfo.start();amb={s,lfo};
  }else if(!want&&amb){try{amb.s.stop();amb.lfo.stop()}catch(e){}amb=null}
}
function bell(pitch){
  if(!ac||muted)return;const tt=ac.currentTime;
  [1,1.5,2.01].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=pitch*m;
    g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(.11/(i+1),tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+1.1);
    o.connect(g).connect(master);o.start(tt);o.stop(tt+1.2)});
}
function noise(dur,freq,vol){
  if(!ac||muted)return;const tt=ac.currentTime,len=Math.floor(dur*ac.sampleRate),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;
  s.connect(f).connect(g).connect(master);s.start(tt);
}

/* ================= 更新 ================= */
function update(dt){
  time+=dt;
  const play=state==='play',moving=play||state==='menu'||state==='over';

  if(keyDir&&beams[0])beams[0].t+=keyDir*3*(1+.3*(UP.spin||0))*dt;
  if(state==='menu')beams[0].t+=dt*.55;
  for(const b of beams){
    const d=angDiff(b.t,b.a),m=rotSpeed()*dt;b.a+=Math.abs(d)<m?d:Math.sign(d)*m;
    if(play){
      const tank=1+.35*(UP.tank||0);
      if(b.on){b.oil-=.042*(b.boost>0?2:1)/tank*dif().oil*dt;if(b.oil<=0){b.oil=0;b.on=false;b.boost=0;float(cx,cy-40*U,t('f_oilOut'),'#ff6b57');noise(.3,300,.25)}}
      else b.oil=Math.min(1,b.oil+.1*(1+.2*(UP.tank||0))*dt);
      if(b.boost>0)b.boost=Math.max(0,b.boost-dt);
      if(b.cd>0)b.cd=Math.max(0,b.cd-dt);
    }
  }
  if(tmpWide>0&&play)tmpWide=Math.max(0,tmpWide-dt);
  prepRays();

  for(const w of waves)w.ph+=dt*(weather.storm?1.8:.8);

  if(weather.fog)for(const f of fogs){f.x+=f.vx*dt;if(f.x>W+f.r)f.x=-f.r;if(f.x<-f.r)f.x=W+f.r}
  const tgtR=weather.tide&&play?R*(1+.16*Math.sin(elapsed*TAU/22)):R;
  Rcur+=(tgtR-Rcur)*Math.min(1,dt*3);
  if(weather.storm&&play){lightT-=dt;if(lightT<=0){flash=.45;lightT=rr(4.5,8.5);setTimeout(()=>noise(1.4,180,.6),250)}}
  flash=Math.max(0,flash-dt);

  if(state==='menu'){spawnT-=dt;if(spawnT<=0){spawn();spawnT=rnd(1.4,2.4)}}
  if(play&&tut>0){
    // 教程期间时钟停住，只保留一艘慢船当练习
    if(tut===1&&!boats.some(b=>b.state==='sail')){
      const a=beams[0].a+Math.PI*.6,d=Math.min(W,H)/2+20;
      const x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,b=mkBoat('fish',x,y,Math.atan2(cy-y,cx-x),0);b.v*=.45;boats.push(b);
    }
  }else if(play){
    elapsed+=dt;totalT+=dt;
    if(mode==='endless'&&totalT>=300)unlock('endless5');
    const len=nightLen();
    setText('clock',mode==='endless'?fmtTime(totalT):clockStr(elapsed/len));
    if(elapsed<len-3||mode==='endless'){
      spawnT-=dt;
      if(spawnT<=0){spawn();spawnT=Math.max(.5,2.1-.2*(Math.min(level(),9)-1))*rr(.7,1.25)*(mode==='duo'?.8:1)*(bossNight?1.25:1)*dif().spawn}
      itemT-=dt;if(itemT<=0){spawnItem();itemT=rr(9,15)}
      if(level()>=3){whaleT-=dt;if(whaleT<=0){spawnWhale();whaleT=rr(22,34)}}
    }
    if(bossT>0){bossT-=dt;if(bossT<=0)spawnBoss()}
  }

  // 漂流物
  if(play)for(let i=items.length-1;i>=0;i--){
    const it=items[i];it.t+=dt;it.x+=Math.sin(it.ph+it.t*.4)*5*U*dt;it.y+=Math.cos(it.ph+it.t*.3)*4*U*dt;
    if(hits(it.x,it.y)){it.lit+=dt;if(it.lit>=.35){collect(it);items.splice(i,1);continue}}else it.lit=Math.max(0,it.lit-dt);
    if(it.t>it.life)items.splice(i,1);
  }
  // 鲸鱼
  if(moving)for(let i=whales.length-1;i>=0;i--){
    const w=whales[i];w.t+=dt;w.x+=Math.cos(w.h)*w.v*dt;w.y+=Math.sin(w.h)*w.v*dt;
    w.a=Math.max(0,Math.min(1,w.t/2,(w.dur-w.t)/2));
    w.sp-=dt;if(w.sp<=0&&w.a>.5){w.sp=rr(3,5);for(let k=0;k<12;k++){const a=-Math.PI/2+rnd(-.5,.5),s=rnd(30,70)*U;
      parts.push({x:w.x+Math.cos(w.h)*w.r*.8,y:w.y+Math.sin(w.h)*w.r*.8,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,1),max:1,col:'foam'})}}
    if(w.t>w.dur)whales.splice(i,1);
  }

  if(moving)for(let i=boats.length-1;i>=0;i--){
    const b=boats[i],T=TYPES[b.type];b.blink+=dt*(b.danger?14:4);
    b.hit=hits(b.x,b.y);b.fog=inFog(b.x,b.y);
    if(b.state==='sail'){
      if(vortex){ // 漩涡把船卷向切线方向，离开后船长会慢慢把航向修回灯塔
        const vx=b.x-vortex.x,vy=b.y-vortex.y,vd=Math.hypot(vx,vy);
        if(vd<vortex.r&&(b.vt||0)<3){b.vt=(b.vt||0)+dt;const tg=Math.atan2(vy,vx)+Math.PI/2+.35,dd=angDiff(tg,b.h);b.h+=Math.sign(dd)*Math.min(Math.abs(dd),1.5*(1-vd/vortex.r)*(1-b.vt/3)*dt);b.drift=true}
        else if(b.drift){const dd=angDiff(Math.atan2(cy-b.y,cx-b.x),b.h);b.h+=Math.sign(dd)*Math.min(Math.abs(dd),.5*dt)}
      }
      const sp=T.pirate&&b.hit?1.9:1;
      b.x+=Math.cos(b.h)*b.v*sp*dt;b.y+=Math.sin(b.h)*b.v*sp*dt;
      const dist=Math.hypot(b.x-cx,b.y-cy);
      if(dist>L/2+150){boats.splice(i,1);continue} // 迷航出界的船直接离场，不会卡住天亮
      b.danger=dist<Rcur+70*U+(T.boss?40*U:0);
      if((play||state==='menu')&&b.hit){
        b.lit+=dt*b.hit*(1+.2*(UP.focus||0))*(b.fog&&!UP.foglamp?.5:1);
        if(b.lit>=T.need)charge(b);
      }else b.lit=Math.max(0,b.lit-dt*(T.boss?.25:.4)*(UP.glow?.15:1));
      if(b.state==='sail'&&dist<Rcur+T.size*9*U)wreck(b);
    }else if(b.state==='saved'){
      b.t+=dt;
      const out=Math.atan2(b.y-cy,b.x-cx)+b.turn*.85;
      const dd=angDiff(out,b.h);b.h+=Math.sign(dd)*Math.min(Math.abs(dd),2.2*dt);
      b.x+=Math.cos(b.h)*b.v0*1.25*dt;b.y+=Math.sin(b.h)*b.v0*1.25*dt;
      if(Math.random()<dt*20)parts.push({x:b.x-Math.cos(b.h)*8*U,y:b.y-Math.sin(b.h)*8*U,vx:0,vy:0,life:1.2,max:1.2,col:'wake'});
      if(b.t>(T.boss?12:6)||Math.hypot(b.x-cx,b.y-cy)>L/2+80)boats.splice(i,1);
    }else if(b.state==='wreck'){b.t+=dt;if(b.t>1.6)boats.splice(i,1)}
  }

  if(parts.length>450)parts.splice(0,parts.length-450);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;if(p.life<=0)parts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;f.y-=18*dt;if(f.t>1.5)floats.splice(i,1)}
  shake=Math.max(0,shake-dt);

  if(play){
    syncOil();syncCtrl();
    const len=nightLen();
    if(!tut&&mode!=='endless'&&elapsed>len+15)boats.forEach(x=>{if(x.state==='sail'&&!TYPES[x.type].boss)x.state='saved',x.t=0,x.turn=1});
    if(!tut&&(mode==='endless'?elapsed>=len&&bossT<=0&&!boats.some(b=>b.type==='flag'&&b.state==='sail'):(elapsed>=len&&bossT<=0&&!boats.some(b=>b.state==='sail'))))endNight();
  }
}

function charge(b){
  if(b.charges>1){
    b.charges--;b.lit=0;b.v*=1.3;
    if(state==='play'){float(b.x,b.y-16*U,t('f_stub'),'#b9a6c9');bell(440)}
    return;
  }
  save(b);
}
function save(b){
  const T=TYPES[b.type];b.state='saved';b.t=0;
  const radial=Math.atan2(b.y-cy,b.x-cx);
  b.turn=angDiff(b.h,radial+Math.PI)>0?1:-1;
  if(state!=='play')return;
  if(time-lastSave<1.2)combo++;else combo=1;lastSave=time;
  let gain=T.pts+(combo>1?combo-1:0);
  float(b.x,b.y-14*U,'+'+gain,'#7fd3c3');
  if(combo>1)float(b.x,b.y-30*U,t('f_combo',{n:combo}),'#ffd27a');
  if(b.g&&groups[b.g]){const g=groups[b.g];g.saved++;
    if(g.saved===g.total&&!g.failed){gain+=4;float(b.x,b.y-46*U,t('f_fleet'),'#ff8a3d');progress('life');unlock('fleet')}}
  if(T.boss){
    progress('flag');
    unlock('boss');const av=availUpg();
    if(av.length){const u=av[Math.floor(Math.random()*av.length)];const nm=upgName(u.id);applyUpgrade(u.id);float(cx,cy-70*U,t('f_gift',{u:nm}),'#d6b25a')}
  }
  score+=gain;nightSaved++;updateHud();
  ST.guided++;ST.by[b.type]=(ST.by[b.type]||0)+1;if(combo>ST.combo)ST.combo=combo;if(T.boss)ST.flags++;saveStats();
  if(tut===1)setTut(2);
  unlock('first');
  if(combo>=3)progress('combo3');if(combo>=4)progress('combo4');if(combo>=5)unlock('combo5');

  if(b.type==='smug')unlock('smug');
  if(T.supply){beams.forEach(x=>x.oil=Math.min(1,x.oil+.6));float(b.x,b.y-46*U,t('f_supply'),'#7fd3c3');unlock('supply');progress('supply')}

}
function wreck(b){
  b.state='wreck';b.t=0;
  const T=TYPES[b.type],live=state==='play';
  for(let k=0;k<(T.boss?50:22);k++){const a=Math.random()*TAU,s=rnd(20,110)*U;
    parts.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.5,1.2),max:1.2,col:k%3?'foam':'fire'})}
  if(!live||tut)return;

  combo=0;nightWreck++;

  if(cost){lives=Math.max(0,lives-cost);renderLives();shake=(reduceMotion||!SET.shake)?0:(T.boss?.6:.35);noise(.6,520,.5)}

}

/* ================= 绘制 ================= */
let gcache={};
const glowCache={};
function glowSprite(hex){
  let c=glowCache[hex];if(c)return c;
  const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;
  c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');
  const gr=x.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba('+r+','+g+','+b+',.9)');gr.addColorStop(.3,'rgba('+r+','+g+','+b+',.35)');gr.addColorStop(1,'rgba('+r+','+g+','+b+',0)');
  x.fillStyle=gr;x.fillRect(0,0,32,32);return glowCache[hex]=c;
}
function beamRGB(){const c=SET.beam||'amber';return COLORS[c]&&colorOpen(c)?COLORS[c]:COLORS.amber}
function colorOpen(c){return !COLOR_LOCK[c]||achGot.has(COLOR_LOCK[c])}
function mix(c,v,k){return[c[0]+(v-c[0])*k|0,c[1]+(v-c[1])*k|0,c[2]+(v-c[2])*k|0]}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function draw(now){
  ctx.save();
  if(shake>0)ctx.translate(rnd(-1,1)*shake*16,rnd(-1,1)*shake*16);
  const C=beamRGB(),ck=C.join()+W+'x'+H;
  if(gcache.key!==ck){gcache={key:ck}}
  const sk=weather.storm?'bgS':'bg';
  if(!gcache[sk]){const g=ctx.createRadialGradient(cx,cy,R*.5,cx,cy,L*.6);g.addColorStop(0,weather.storm?'#0c222c':'#0f2a37');g.addColorStop(1,'#050f15');gcache[sk]=g}
  ctx.fillStyle=gcache[sk];ctx.fillRect(-20,-20,W+40,H+40);
  if(weather.moon)drawMoon();

  const litWave=rgba(mix(C,255,.35),.38);
  ctx.lineWidth=1.2;ctx.lineCap='round';
  for(const w of waves){
    const lit=hits(w.x,w.y)>0||flash>0;
    ctx.strokeStyle=lit?litWave:'rgba(140,180,195,.07)';
    const o=Math.sin(w.ph)*(weather.storm?6:3)*U;
    ctx.beginPath();ctx.moveTo(w.x-w.len/2,w.y+o);ctx.quadraticCurveTo(w.x,w.y+o-4*U,w.x+w.len/2,w.y+o);ctx.stroke();
  }

  // 光束
  const half=beamHalf();
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const b of beams){
    if(!b.on)continue;const boost=b.boost>0;
    const gk=boost?'beamB':'beam';
    if(!gcache[gk]){const bg=ctx.createRadialGradient(cx,cy,10,cx,cy,L*.75);const c=boost?mix(C,255,.55):C;
      bg.addColorStop(0,rgba(c,boost?.6:.42));bg.addColorStop(.45,rgba(c,boost?.22:.14));bg.addColorStop(1,rgba(c,0));gcache[gk]=bg}
    for(const a of rays(b)){
      ctx.fillStyle=gcache[gk];ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,L,a-half,a+half);ctx.closePath();ctx.fill();
      ctx.fillStyle=rgba(mix(C,255,.4),.1);ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,L*.8,a-half*.35,a+half*.35);ctx.closePath();ctx.fill();
    }
  }
  ctx.restore();

  // 鲸鱼投下的影子
  for(const w of whales){
    if(w.a<.5)continue;const wx=w.x-cx,wy=w.y-cy,dw=Math.hypot(wx,wy);if(dw<=w.r)continue;
    const th=Math.atan2(wy,wx),al=Math.asin(Math.min(1,w.r/dw));

  for(const p of parts){

    else{ctx.fillStyle=p.col==='fire'?'rgba(255,120,80,'+a+')':'rgba(230,240,242,'+a*.8+')';ctx.beginPath();ctx.arc(p.x,p.y,2*U,0,TAU);ctx.fill()}
  }

  // 礁石

  ctx.beginPath();ctx.arc(cx,cy,Rcur+12*U+Math.sin(tt*1.3)*2,0,TAU);ctx.stroke();
  for(const r of rocks){
    const rad=Rcur+r.off,x=cx+Math.cos(r.a)*rad,y=cy+Math.sin(r.a)*rad;

  }

  if(vortex)drawVortex(tt);
  for(const it of items)drawItem(it,tt);
  for(const w of whales)drawWhale(w);
  for(const b of boats)drawBoat(b);
  if(SET.warn&&state==='play')drawWarnings(tt);

  if(weather.fog)for(const f of fogs){
    const fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);
    fg.addColorStop(0,'rgba(150,170,178,.55)');fg.addColorStop(.6,'rgba(120,140,150,.32)');fg.addColorStop(1,'rgba(110,130,140,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,TAU);ctx.fill();
  }
  if(weather.storm&&state==='play'){
    ctx.strokeStyle='rgba(170,200,215,.22)';ctx.lineWidth=1;ctx.beginPath();
    const mv=!userPause&&!paused;
    for(const d of rain){if(mv){d.y+=14*d.s;d.x-=5*d.s}if(d.y>H){d.y=-10;d.x=Math.random()*(W+100)}if(d.x<-20)d.x=W+20;ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+5*d.s,d.y-14*d.s)}
    ctx.stroke();
  }

  // 灯塔
  const lr=12*U+4,anyOn=beams.some(b=>b.on);
  ctx.fillStyle='#2a3a40';ctx.beginPath();ctx.arc(cx,cy,lr+6*U,0,TAU);ctx.fill();
  ctx.fillStyle='#d9d2c3';ctx.beginPath();ctx.arc(cx,cy,lr,0,TAU);ctx.fill();
  ctx.strokeStyle='#b5463a';ctx.lineWidth=3*U;ctx.beginPath();ctx.arc(cx,cy,lr*.72,0,TAU);ctx.stroke();
  const lg=ctx.createRadialGradient(cx,cy,0,cx,cy,lr*2.4);
  if(anyOn){lg.addColorStop(0,rgba(mix(C,255,.6),1));lg.addColorStop(.25,rgba(C,.9));lg.addColorStop(1,rgba(C,0))}
  else{lg.addColorStop(0,'rgba(130,120,100,.8)');lg.addColorStop(.3,'rgba(90,85,75,.4)');lg.addColorStop(1,'rgba(90,85,75,0)')}
  ctx.fillStyle=lg;ctx.beginPath();ctx.arc(cx,cy,lr*2.4,0,TAU);ctx.fill();
  if(beams.length>1){
    ctx.font='700 '+Math.round(9*U+3)+'px "JetBrains Mono", monospace';ctx.textAlign='center';
    beams.forEach((b,i)=>{ctx.fillStyle=b.on?'#ffd27a':'#5b6b70';ctx.fillText('P'+(i+1),cx+Math.cos(b.a)*(lr+20*U),cy+Math.sin(b.a)*(lr+20*U)+4)});
  }

  ctx.textAlign='center';ctx.font='700 '+Math.round((13*U+2)*(SET.big?1.2:1))+'px "JetBrains Mono", ui-monospace, "PingFang SC", "Hiragino Sans", sans-serif';
  for(const f of floats){ctx.globalAlpha=Math.max(0,1-f.t/1.5);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y)}
  ctx.globalAlpha=1;

  if(flash>0&&!reduceMotion&&SET.flashFx!==false){ctx.fillStyle='rgba(220,235,255,'+(flash*.5)+')';ctx.fillRect(-20,-20,W+40,H+40)}
  if(state==='play'&&mode!=='endless'){const p=elapsed/nightLen();if(p>.8){ctx.fillStyle='rgba(120,160,190,'+((p-.8)*.4)+')';ctx.fillRect(-20,-20,W+40,H+40)}}
  ctx.restore();
}

function drawVortex(tt){
  const v=vortex;ctx.save();ctx.translate(v.x,v.y);
  ctx.strokeStyle='rgba(150,200,215,.15)';ctx.lineWidth=2*U;ctx.lineCap='round';
  for(let k=0;k<5;k++){const r=v.r*(k+1)/5,a0=tt*(1.7-k*.22)+k*1.3;ctx.beginPath();ctx.arc(0,0,r,a0,a0+Math.PI*1.2);ctx.stroke()}
  ctx.fillStyle='rgba(3,10,14,.65)';ctx.beginPath();ctx.arc(0,0,v.r*.12,0,TAU);ctx.fill();ctx.restore();
}
function drawMoon(){
  const mx=W*.7,my=Math.max(70,H*.15),r=22*U;
  if(!gcache.moon){const g=ctx.createRadialGradient(mx,my,0,mx,my,r*6);g.addColorStop(0,'rgba(225,235,245,.16)');g.addColorStop(1,'rgba(225,235,245,0)');gcache.moon=g}
  ctx.fillStyle=gcache.moon;ctx.fillRect(mx-r*6,my-r*6,r*12,r*12);
  ctx.fillStyle='rgba(236,240,230,.9)';ctx.beginPath();ctx.arc(mx,my,r,0,TAU);ctx.fill();
}
function drawWarnings(tt){
  const m=18;
  for(const b of boats){
    if(b.state!=='sail')continue;const T=TYPES[b.type];if(T.dark)continue;
    if(b.x>=0&&b.x<=W&&b.y>=0&&b.y<=H)continue;
    const dx=b.x-cx,dy=b.y-cy;
    const sx=dx>0?(W-m-cx)/dx:dx<0?(m-cx)/dx:Infinity,sy=dy>0?(H-m-cy)/dy:dy<0?(m-cy)/dy:Infinity;
    const s=Math.min(sx,sy);if(!(s>0&&s<1))continue;
    const px=cx+dx*s,py=cy+dy*s,a=Math.atan2(dy,dx),z=(T.boss?7:5)*U;
    const col=T.boss?'#d6b25a':T.pirate?'#ff6b57':b.type==='life'?'#ff8a3d':'#ffd27a';
    ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.globalAlpha=.55+.3*Math.sin(tt*5+b.blink);
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(z,0);ctx.lineTo(-z*.8,-z*.8);ctx.lineTo(-z*.35,0);ctx.lineTo(-z*.8,z*.8);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}
function drawItem(it,tt){
  const lit=hits(it.x,it.y)>0||flash>0,s=6*U;
  const fade=Math.min(1,(it.life-it.t)/2);
  ctx.save();ctx.translate(it.x,it.y);ctx.globalAlpha=(lit?1:.5+.25*Math.sin(tt*3+it.ph))*fade;
  ctx.rotate(Math.sin(tt*1.5+it.ph)*.3);
  if(it.type==='oil'){ctx.fillStyle='#8a5a2b';ctx.fillRect(-s*.7,-s,s*1.4,s*2);ctx.fillStyle='#ffd27a';ctx.fillRect(-s*.7,-s*.25,s*1.4,s*.5)}
  else if(it.type==='bottle'){ctx.fillStyle='#5fa37f';ctx.beginPath();ctx.ellipse(0,0,s*1.1,s*.5,0,0,TAU);ctx.fill();ctx.fillRect(s*.9,-s*.2,s*.6,s*.4);ctx.fillStyle='#f3e7c8';ctx.fillRect(-s*.4,-s*.2,s*.7,s*.4)}
  else{ctx.strokeStyle='#ff8a3d';ctx.lineWidth=s*.55;ctx.beginPath();ctx.arc(0,0,s*.9,0,TAU);ctx.stroke();ctx.strokeStyle='#f6efe4';ctx.setLineDash([s*.7,s*.7]);ctx.stroke();ctx.setLineDash([])}

  if(it.lit>0){ctx.strokeStyle='#ffd27a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(it.x,it.y,s*1.9,-Math.PI/2,-Math.PI/2+TAU*Math.min(1,it.lit/.35));ctx.stroke()}
}
function drawWhale(w){
  if(w.a<=0)return;
  const lit=hits(w.x,w.y,true)>0||flash>0;
  ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.h);ctx.globalAlpha=w.a*(lit?1:.55);
  ctx.fillStyle=lit?'#5e7f8d':'#223843';
  ctx.beginPath();ctx.ellipse(0,0,w.r*1.6,w.r*.72,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.moveTo(-w.r*1.4,0);ctx.lineTo(-w.r*2.2,-w.r*.6);ctx.lineTo(-w.r*2,0);ctx.lineTo(-w.r*2.2,w.r*.6);ctx.closePath();ctx.fill();
  ctx.fillStyle=lit?'#8fb0bc':'#2f4a56';ctx.beginPath();ctx.ellipse(w.r*.3,0,w.r*.9,w.r*.3,0,0,TAU);ctx.fill();

function drawBoat(b){
  const T=TYPES[b.type],s=T.size*9*U;
  const lit=b.state==='saved'||(b.state==='sail'&&b.hit>0)||flash>0;
  if(b.state==='sail'&&b.fog&&!lit)return;
  let alpha;
  if(b.state==='wreck')alpha=Math.max(0,1-b.t/1.6);
  else if(lit)alpha=1;
  else alpha=T.dark?(weather.moon?.22:0):T.boss?.45:(weather.moon?.45:.2);
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.state==='wreck'?b.h+b.t*1.4:b.h);
  if(alpha>0){
    ctx.globalAlpha=alpha;ctx.fillStyle=T.hull;
    ctx.beginPath();ctx.moveTo(s*1.5,0);ctx.quadraticCurveTo(s*.6,s*.62,-s,s*.55);ctx.lineTo(-s,-s*.55);ctx.quadraticCurveTo(s*.6,-s*.62,s*1.5,0);ctx.fill();
    ctx.fillStyle=T.cabin;
    if(T.pirate){ctx.beginPath();ctx.moveTo(s*.6,0);ctx.lineTo(-s*.5,-s*.9);ctx.lineTo(-s*.5,s*.9);ctx.closePath();ctx.fill()}
    else if(T.boss){for(let k=0;k<3;k++)ctx.fillRect(-s*.75+k*s*.55,-s*.24,s*.38,s*.48);ctx.fillRect(-s*.9,-s*.04,s*1.9,s*.08)}

    ctx.globalAlpha=1;
  }
  if(b.state!=='wreck'&&!T.dark){
    const on=b.danger&&b.state==='sail'?(Math.sin(b.blink)>0):true;
    const col=b.state==='saved'?'#7fd3c3':(b.danger?'#ff6b57':(T.pirate?'#ff4d4d':T.boss?'#d6b25a':'#ffb36b'));
    if(on&&!(b.fog&&b.state==='sail'&&!lit)){const gs=glowSprite(col),gr=8*U+3;
      ctx.drawImage(gs,-s*.85-gr,-gr,gr*2,gr*2);ctx.fillStyle=col;ctx.beginPath();ctx.arc(-s*.85,0,2.2*U+.6,0,TAU);ctx.fill();
      if(T.boss){ctx.drawImage(gs,s*1.2-gr,-gr,gr*2,gr*2);ctx.beginPath();ctx.arc(s*1.2,0,2.2*U+.6,0,TAU);ctx.fill()}}
  }
  ctx.restore();
  if(SET.cb&&b.state==='sail'&&b.danger&&!lit&&alpha>0){ // 色弱友好：危险的船额外加一个感叹号，不只靠红色
    const yy=b.y-s*1.6-6*U,rr0=6*U+1;ctx.fillStyle='#e9eff1';ctx.beginPath();ctx.arc(b.x,yy,rr0,0,TAU);ctx.fill();
    ctx.fillStyle='#07141c';ctx.font='900 '+Math.round(rr0*1.5)+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',b.x,yy+.5);ctx.textBaseline='alphabetic';
  }
  if(b.state==='sail'&&b.lit>0&&alpha>0){
    ctx.strokeStyle=b.fog?'#c9c3a8':(T.boss?'#d6b25a':'#ffd27a');ctx.lineWidth=T.boss?4:2.5;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(b.x,b.y,s*1.9,-Math.PI/2,-Math.PI/2+TAU*Math.min(1,b.lit/T.need));ctx.stroke();
  }
}

/* ================= 排行榜（共享数据） ================= */
// 每人一行 scores/<自己的 id>：d=每日一夜各天成绩（只留最近 14 天），b=各模式普通难度最高分。只存 id，名字渲染时再解析。
let DB=null,USER=null,ME=null,boardDocs=new Map(),boardState='off',boardRO=false,boardTab='daily',boardQueue=Promise.resolve();
(async()=>{
  try{
    const c=window.claude;if(!c||typeof c.use!=='function')return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    DB=db;USER=user;ME=id;boardState='loading';$('menuBoardBtn').hidden=false;
    try{if(await user.can('data.write')===false)boardRO=true}catch(e){}
    const timer=setTimeout(()=>{if(boardState==='loading'){boardState='slow';renderBoard()}},10000);
    db.collection('scores').onSnapshot(snap=>{
      boardDocs=new Map(snap.docs.map(d=>[d.id,d.data()]));
      if(!snap.metadata.fromCache){boardState='ready';clearTimeout(timer)}
      renderBoard();
    },()=>{boardState='error';clearTimeout(timer);renderBoard()});
  }catch(e){}
})();
function boardRows(tab,docs){
  const k=String(todayKey()),rows=[];
  for(const [id,d] of docs){
    if(!d)continue;
    if(tab==='daily'){const e=d.d&&d.d[k];if(e&&e.s>0)rows.push({id,s:e.s,w:!!e.w})}
    else{const v=d.b&&d.b[tab];if(v>0)rows.push({id,s:v})}
  }
  rows.sort((a,b)=>b.s-a.s||(b.w?1:0)-(a.w?1:0));
  return rows;
}
let renderSeq=0;
async function renderBoard(){
  if($('board').hidden)return;
  const seq=++renderSeq,list=$('boardList'),note=$('boardNote');
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===boardTab));
  const rows=boardRows(boardTab,boardDocs);
  let msg=boardTab==='daily'?t('bdDailyNote'):t('bdNote');
  if(boardState==='loading')msg=t('bdLoading');
  else if(boardState==='slow')msg=t('bdSlow');
  else if(boardState==='error')msg=t('bdErr');
  if(boardRO)msg+=' '+t('bdRO');
  note.textContent=msg;
  const mi=rows.findIndex(r=>r.id===ME),show=rows.slice(0,20);
  const extra=mi>=20?rows[mi]:null;
  const ps=USER?await USER.profiles([...show,...(extra?[extra]:[])].map(r=>r.id)):{};
  if(seq!==renderSeq)return;
  list.innerHTML='';
  if(!rows.length){const li=document.createElement('li');li.className='gap';li.textContent=boardState==='ready'||boardState==='slow'?t('bdEmpty'):'';list.appendChild(li);return}
  const add=(r,i)=>{
    const li=document.createElement('li');if(r.id===ME)li.className='me';
    const no=document.createElement('span');no.className='no';no.textContent=i+1;
    const p=ps[r.id]||{},im=document.createElement('img');im.alt='';if(p.avatarUrl)im.src=p.avatarUrl;else im.style.visibility='hidden';
    const nm=document.createElement('span');nm.className='nm';nm.textContent=(r.id===ME?t('you')+' · ':'')+(p.name||t('someone'));
    const sc=document.createElement('span');sc.className='sc';
    if(r.w){const w=document.createElement('small');w.textContent=t('survived');sc.appendChild(w)}
    sc.appendChild(document.createTextNode(r.s));
    li.append(no,im,nm,sc);list.appendChild(li);
  };
  show.forEach(add);
  if(extra){const g=document.createElement('li');g.className='gap';g.textContent='⋯';list.appendChild(g);add(extra,mi)}
}
function submitScore(done){
  $('oRank').hidden=true;
  if(!DB||!ME||boardRO||tut||score<=0)return;
  const mine=boardDocs.get(ME)||{},k=String(todayKey());
  const doc={d:Object.assign({},mine.d||{}),b:Object.assign({},mine.b||{})};
  let changed=false,tab=null;
  if(mode==='daily'){
    tab='daily';const old=doc.d[k];
    if(!old||score>old.s||(score===old.s&&done&&!old.w)){doc.d[k]={s:score,w:done?1:0};changed=true}
    const days=Object.keys(doc.d).sort();while(days.length>14)delete doc.d[days.shift()];
  }else if(runDiff==='normal'&&mode!=='log'){tab=mode;if(score>(doc.b[mode]||0)){doc.b[mode]=score;changed=true}}
  if(!tab)return;
  const local=new Map(boardDocs);local.set(ME,doc);
  const rows=boardRows(tab,local),rk=rows.findIndex(r=>r.id===ME);
  if(rk>=0){$('oRank').textContent=t('rankLine',{b:tab==='daily'?t('bd_today'):t('m_'+tab),r:rk+1,n:rows.length});$('oRank').hidden=false}
  if(!changed)return;
  boardDocs=local; // 先在本地显示，写入确认后快照会再同步一次
  boardQueue=boardQueue.then(()=>DB.doc('scores/'+ME).set(doc)).catch(e=>{
    if(e&&e.code==='invalid_argument'){boardRO=true;$('oRank').textContent=t('bdRO')}
    else if(e&&e.code==='unavailable')setTimeout(()=>DB.doc('scores/'+ME).set(doc).catch(()=>{}),800+Math.random()*800);
  });
}
function openBoard(tab){
  if(tab)boardTab=tab;$('menu').hidden=true;$('board').hidden=false;renderBoard();
  setTimeout(()=>$('boardBackBtn').focus({preventScroll:true}),30);
}

/* ================= 循环与输入 ================= */
let last=performance.now(),paused=false;
const padPrev={};
function pollPads(){
  if(!navigator.getGamepads)return;let pads;try{pads=navigator.getGamepads()}catch(e){return}
  for(const p of pads){
    if(!p||!p.connected)continue;
    const pv=padPrev[p.index]||[],pr=i=>!!(p.buttons[i]&&p.buttons[i].pressed),edge=i=>pr(i)&&!pv[i];
    const ov=['settings','stats','board','levels','pause','dusk','over','menu'].map(id=>$(id)).find(e=>!e.hidden);
    if(ov){ // 菜单：十字键移动焦点，A 确认，B/Start 返回
      const btns=[...ov.querySelectorAll('button')].filter(b=>!b.disabled&&b.offsetParent!==null);
      let i=btns.indexOf(document.activeElement);
      if(edge(13)||edge(15)){i=(i+1)%btns.length;btns[i]&&btns[i].focus()}
      if(edge(12)||edge(14)){i=(i-1+btns.length)%btns.length;btns[i]&&btns[i].focus()}
      if(edge(0)&&i>=0)btns[i].click();
      if(edge(1)||edge(9)){if(!$('settings').hidden)closeSettings();else if(userPause)resumeGame();else if(!$('stats').hidden){$('stats').hidden=true;$('menu').hidden=false}else if(!$('board').hidden){$('board').hidden=true;$('menu').hidden=false}else if(!$('levels').hidden){$('levels').hidden=true;$('menu').hidden=false}}
    }else if(state==='play'){
      const b=beams[Math.min(p.index,beams.length-1)];
      const x=p.axes[0]||0,y=p.axes[1]||0;if(b&&x*x+y*y>.16)b.t=Math.atan2(y,x);
      if(edge(0)||edge(7))doBoost(b);
      if(edge(1)||edge(2)||edge(6))toggleLamp(b);
      if(edge(9))pauseGame();
    }
    padPrev[p.index]=p.buttons.map(x=>x.pressed);
  }
}
addEventListener('gamepadconnected',()=>{showToast(t('pad'));audio()});
let lowQ=false,frameAvg=1/60,slowFor=0;
function frame(now){pollPads();const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;
  // 连续 3 秒平均低于约 40 帧，就把像素密度降到 1 倍并减半波纹，低端手机也能流畅
  if(!lowQ&&!paused&&!userPause&&state==='play'&&raw<.25){frameAvg=frameAvg*.95+raw*.05;slowFor=frameAvg>1/40?slowFor+raw:0;if(slowFor>3){lowQ=true;resize();gcache={}}}if(!paused&&!userPause)update(dt);draw(now);requestAnimationFrame(frame)}

/* ---------- 暂停 / 设置 / 统计 ---------- */
function pauseGame(){
  if(state!=='play'||userPause)return;userPause=true;keyDir=0;
  $('pauseLbl').textContent=nightTitle()+' · '+$('clock').textContent;
  $('pause').hidden=false;setTimeout(()=>$('resumeBtn').focus({preventScroll:true}),30);
}
function resumeGame(){userPause=false;$('pause').hidden=true;$('settings').hidden=true;last=performance.now()}
let setFrom='menu';
function openSettings(from){
  setFrom=from;$(from).hidden=true;syncSettings();$('settings').hidden=false;
  setTimeout(()=>$('setDoneBtn').focus({preventScroll:true}),30);
}
function closeSettings(){$('settings').hidden=true;$(setFrom).hidden=false;if(setFrom==='menu'){loadBests();refreshMenu()}}
function syncSettings(){
  document.querySelectorAll('[data-diff]').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.diff===SET.diff);b.disabled=state==='play'});
  $('vol').value=SET.vol;
  [['optAmb','ambient'],['optShake','shake'],['optFlash','flashFx'],['optWarn','warn'],['optCb','cb'],['optBig','big']].forEach(([id,k])=>{const b=$(id);b.setAttribute('aria-pressed',!!SET[k]);b.textContent=SET[k]?t('on'):t('off')});
  document.body.classList.toggle('big',!!SET.big);
  if(!colorOpen(SET.beam||'amber'))SET.beam='amber';
  document.querySelectorAll('[data-beam]').forEach(b=>{const c=b.dataset.beam;b.setAttribute('aria-pressed',c===SET.beam);b.disabled=!colorOpen(c)});
  const locked=Object.keys(COLOR_LOCK).filter(c=>!colorOpen(c));
  $('colorNote').textContent=locked.length?t('lockNote',{list:locked.map(c=>t('lockItem',{c:t('c_'+c),a:t('a_'+COLOR_LOCK[c])})).join(t('sep'))}):t('allOpen');
}
function openStats(){
  const rows=[['stRuns',ST.runs],['stGuided',ST.guided],['stNights',ST.nights],['stItems',ST.items],['stFlags',ST.flags],['stCombo',ST.combo?'×'+ST.combo:'0'],['stTasks',tasksDone],['stAch',achGot.size+'/'+ACH.length]];
  const fill=(el,list)=>{el.innerHTML='';for(const [k,v] of list){const a=document.createElement('span');a.textContent=k;const b=document.createElement('span');b.textContent=v;el.append(a,b)}};
  fill($('statLog'),rows.map(([k,v])=>[t(k),v]));
  fill($('statType'),Object.keys(TYPES).map(k=>[t('b_'+k),ST.by[k]||0]));
  $('menu').hidden=true;$('stats').hidden=false;setTimeout(()=>$('statBackBtn').focus({preventScroll:true}),30);
}
function copyResult(btn){
  const txt=lastShare,box=$('shareTxt');
  const fail=()=>{box.textContent=txt;box.hidden=false;btn.textContent=t('copyFail');
    try{const r=document.createRange();r.selectNodeContents(box);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent=t('copied');box.textContent=txt;box.hidden=false},fail)}catch(e){fail()}
}

function aim(e){const r=cv.getBoundingClientRect();const b=ptrBeam();if(b)b.t=Math.atan2(e.clientY-r.top-cy,e.clientX-r.left-cx)}
function nearTower(e){const r=cv.getBoundingClientRect();return Math.hypot(e.clientX-r.left-cx,e.clientY-r.top-cy)<(12*U+4)*2.2}
cv.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)aim(e)});
cv.addEventListener('pointerdown',e=>{
  if(e.button===2)return;
  if(state==='play'&&nearTower(e)){toggleLamp(ptrBeam());return}
  aim(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('contextmenu',e=>{e.preventDefault();toggleLamp(ptrBeam())});
addEventListener('keydown',e=>{
  const k=e.key;
  if((k==='Escape'||k==='p'||k==='P')&&state==='play'&&!e.repeat){
    if(!$('settings').hidden)closeSettings();else if(userPause)resumeGame();else pauseGame();
    e.preventDefault();return;
  }
  if(k==='Escape'&&state==='menu'){
    if(!$('settings').hidden)closeSettings();else if(!$('stats').hidden){$('stats').hidden=true;$('menu').hidden=false}
    else if(!$('board').hidden){$('board').hidden=true;$('menu').hidden=false}
    else if(!$('levels').hidden){$('levels').hidden=true;$('menu').hidden=false}
    return;
  }
  if(userPause)return;
  if(k==='ArrowLeft'||k==='a'||k==='A'){keyDir=-1;e.preventDefault()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){keyDir=1;e.preventDefault()}
  else if(state==='play'&&!e.repeat){
    if(k==='s'||k==='S'||k==='ArrowDown'){toggleLamp(beams[0]);e.preventDefault()}
    else if(k===' '||k==='w'||k==='W'||k==='ArrowUp'){doBoost(beams[0]);e.preventDefault()}
    else if(k==='Enter'&&beams.length>1){doBoost(beams[1]);e.preventDefault()}
  }
});
addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key))keyDir=0});
document.addEventListener('visibilitychange',()=>{
  paused=document.hidden;last=performance.now();
  if(document.hidden){pauseGame();if(ac&&ac.state==='running')ac.suspend()}
  else if(ac&&ac.state==='suspended')ac.resume(); // 切走时连海浪声也一起停
});
addEventListener('resize',resize);

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{audio();startRun(b.dataset.mode)});
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('keeper-lang',lang)}catch(e){}applyStatic()});
$('againBtn').onclick=()=>{audio();startRun(mode)};
$('menuBtn').onclick=()=>{const wasLog=mode==='log';toMenu();if(wasLog)openLevels()};
$('logBtn').onclick=openLevels;
$('levelsBackBtn').onclick=()=>{$('levels').hidden=true;$('menu').hidden=false};
$('nextLvBtn').onclick=()=>{const n=LEVELS[curLevel.id];if(n&&lvOpen(n.id)){audio();curLevel=n;startRun('log')}};
$('lampBtn').onclick=e=>{e.currentTarget.blur();toggleLamp(ptrBeam())};
$('boostBtn').onclick=e=>{e.currentTarget.blur();doBoost(ptrBeam())};
$('mute').onclick=function(){muted=!muted;this.textContent=muted?t('soundOff'):t('soundOn');this.setAttribute('aria-pressed',muted);applyVol();ambientSync()};
$('pauseBtn').onclick=e=>{e.currentTarget.blur();pauseGame()};
$('skipBtn').onclick=e=>{e.currentTarget.blur();skipTut()};
$('resumeBtn').onclick=resumeGame;
$('restartBtn').onclick=()=>{resumeGame();audio();startRun(mode)};
$('pauseMenuBtn').onclick=()=>{resumeGame();setTut(0);toMenu()};
$('pauseSetBtn').onclick=()=>openSettings('pause');
$('menuSetBtn').onclick=()=>openSettings('menu');
$('menuStatBtn').onclick=openStats;
$('statBackBtn').onclick=()=>{$('stats').hidden=true;$('menu').hidden=false};
$('setDoneBtn').onclick=closeSettings;
document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{SET.diff=b.dataset.diff;saveSet();syncSettings()});
$('vol').oninput=e=>{SET.vol=+e.target.value;saveSet();applyVol();ambientSync()};
$('vol').onchange=()=>{audio();bell(880)};
[['optAmb','ambient'],['optShake','shake'],['optFlash','flashFx'],['optWarn','warn'],['optCb','cb'],['optBig','big']].forEach(([id,k])=>$(id).onclick=()=>{SET[k]=!SET[k];saveSet();syncSettings();audio()});
$('copyBtn').onclick=e=>copyResult(e.currentTarget);
$('menuBoardBtn').onclick=()=>openBoard(boardTab);
$('boardBackBtn').onclick=()=>{$('board').hidden=true;$('menu').hidden=false};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{boardTab=b.dataset.tab;renderBoard()});
$('contBtn').onclick=()=>{const s=loadSave();if(!s){refreshMenu();return}audio();startRun(s.mode,s)};
document.querySelectorAll('[data-beam]').forEach(b=>b.onclick=()=>{if(!colorOpen(b.dataset.beam))return;SET.beam=b.dataset.beam;saveSet();syncSettings()});

resize();renderLives();buildOil();applyStatic();
for(let i=0;i<4;i++){spawn();const b=boats[i];const k=rnd(.2,.55);b.x+=(cx-b.x)*k;b.y+=(cy-b.y)*k}
requestAnimationFrame(frame);
// 页面被更新时，正在玩的那一局从当前这一夜继续，而不是退回菜单
const hot=window.claude&&window.claude.hot;
try{if(hot&&typeof hot.snapshot==='function')hot.snapshot(()=>(state==='play'||state==='dusk')&&!tut&&mode!=='log'?{run:{v:1,mode,night,score,lives,maxLives,UP,diff:runDiff,totalT}}:{})}catch(e){}
const bootHot=d=>{if(d&&d.run&&MODES[d.run.mode]&&state==='menu')startRun(d.run.mode,d.run)};
try{if(hot&&typeof hot.ready==='function')hot.ready(bootHot);else bootHot(hot&&hot.data)}catch(e){}
})();
